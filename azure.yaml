# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: mysterious-island
services:
    mysterious-island:
        project: src/mysterious-island
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: An Agent Framework agent with local tools hosted by Foundry.
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: MYSTERIOUS_ISLAND_VECTOR_STORE_ID
              value: ${MYSTERIOUS_ISLAND_VECTOR_STORE_ID}
            - name: AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING
              value: "false"
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: mysterious-island
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-4.1-mini
                version: "2025-04-14"
              name: gpt-4.1-mini
              sku:
                capacity: 50
                name: Standard
        endpoint: https://somenewkid-9758-resource.services.ai.azure.com/api/projects/somenewkid-9758
infra:
    provider: microsoft.foundry
